services:
  - type: web
    name: activos-ti-alan
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bootstrap.py && gunicorn --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////tmp/assets.db
